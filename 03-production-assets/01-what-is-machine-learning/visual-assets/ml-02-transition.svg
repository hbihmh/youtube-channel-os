<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
   <rect width="100%" height="100%" fill="#0d1117"/>
   <style>
     .box { fill: #161b22; stroke: #30363d; stroke-width: 2px; rx: 6px; }
     .text-title { fill: #ffffff; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
     .text-sub { fill: #8b949e; font-family: sans-serif; font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
     .arrow { stroke: #2ea043; stroke-width: 2.5px; fill: none; marker-end: url(#arrow); }
   </style>
   <defs>
     <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
       <path d="M 0 2 L 10 5 L 0 8 z" fill="#2ea043"/>
     </marker>
   </defs>
   <text x="300" y="30" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Curriculum Transition</text>
   
   <rect x="150" y="60" width="300" height="75" class="box" stroke="#58a6ff"/>
   <text x="300" y="87" class="text-title" fill="#58a6ff">ML-01: What is Machine Learning?</text>
   <text x="300" y="112" class="text-sub">Foundations &amp; Core Intuition</text>
   
   <path d="M 300 135 L 300 175" class="arrow"/>
   
   <rect x="260" y="175" width="80" height="30" fill="#21262d" stroke="#30363d" rx="4"/>
   <text x="300" y="190" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle">NEXT</text>
   
   <path d="M 300 205 L 300 245" class="arrow"/>
   
   <rect x="150" y="245" width="300" height="75" class="box" fill="#1f6feb" stroke="#58a6ff"/>
   <text x="300" y="272" class="text-title" fill="#ffffff">ML-02: How Does a Model Learn?</text>
   <text x="300" y="297" class="text-sub" fill="#c9d1d9">Core Architecture &amp; Mechanics</text>
</svg>