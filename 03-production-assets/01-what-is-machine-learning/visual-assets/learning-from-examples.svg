<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
   <rect width="100%" height="100%" fill="#0d1117"/>
   <style>
     .box { fill: #161b22; stroke: #30363d; stroke-width: 2px; rx: 6px; }
     .text { fill: #c9d1d9; font-family: sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
     .arrow { stroke: #58a6ff; stroke-width: 2.5px; fill: none; marker-end: url(#arrow); }
   </style>
   <defs>
     <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
       <path d="M 0 2 L 10 5 L 0 8 z" fill="#58a6ff"/>
     </marker>
   </defs>
   <text x="300" y="35" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Learning From Examples Flow</text>
   
   <rect x="175" y="60" width="250" height="40" class="box"/>
   <text x="300" y="80" class="text">Historical Examples</text>
   <path d="M 300 100 L 300 135" class="arrow"/>
   
   <rect x="175" y="135" width="250" height="45" class="box" stroke="#58a6ff"/>
   <text x="300" y="157.5" class="text" fill="#58a6ff">Learning Procedure</text>
   <path d="M 300 180 L 300 215" class="arrow"/>
   
   <rect x="175" y="215" width="250" height="40" class="box"/>
   <text x="300" y="235" class="text">Trained Model</text>
   <path d="M 300 255 L 300 290" class="arrow"/>
   
   <rect x="175" y="290" width="250" height="40" class="box"/>
   <text x="300" y="310" class="text">New Unseen Input</text>
   <path d="M 300 330 L 300 365" class="arrow"/>
   
   <rect x="175" y="365" width="250" height="40" class="box" fill="#1f6feb"/>
   <text x="300" y="385" class="text" fill="#ffffff">Accurate Prediction</text>
</svg>