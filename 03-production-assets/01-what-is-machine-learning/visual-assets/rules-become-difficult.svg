<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
   <rect width="100%" height="100%" fill="#0d1117"/>
   <style>
     .box { fill: #161b22; stroke: #30363d; stroke-width: 2px; rx: 6px; }
     .text { fill: #c9d1d9; font-family: sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
     .arrow { stroke: #f85149; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
   </style>
   <defs>
     <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
       <path d="M 0 2 L 10 5 L 0 8 z" fill="#f85149"/>
     </marker>
   </defs>
   <text x="300" y="35" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Why Hand-Coded Rules Fail</text>
   
   <rect x="200" y="70" width="200" height="45" class="box" stroke="#f85149"/>
   <text x="300" y="92.5" class="text" fill="#f85149">Complex Pattern (Spam?)</text>
   
   <path d="M 300 115 L 150 160" class="arrow"/>
   <path d="M 300 115 L 300 160" class="arrow"/>
   <path d="M 300 115 L 450 160" class="arrow"/>
   
   <rect x="70" y="160" width="160" height="40" class="box"/>
   <text x="150" y="180" class="text">"FREE" keyword?</text>
   
   <rect x="220" y="220" width="160" height="40" class="box"/>
   <text x="300" y="240" class="text">Misspelled words?</text>
   
   <rect x="370" y="160" width="160" height="40" class="box"/>
   <text x="450" y="180" class="text">Hidden links?</text>
   
   <text x="300" y="320" fill="#8b949e" font-family="sans-serif" font-size="14" text-anchor="middle">Rules explode into an unmaintainable web of exceptions.</text>
</svg>