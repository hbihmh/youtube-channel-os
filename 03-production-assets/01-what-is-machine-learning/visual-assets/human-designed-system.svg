<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
   <rect width="100%" height="100%" fill="#0d1117"/>
   <style>
     .box { fill: #161b22; stroke: #30363d; stroke-width: 2px; rx: 6px; }
     .text { fill: #c9d1d9; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
     .arrow { stroke: #2ea043; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
   </style>
   <defs>
     <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
       <path d="M 0 2 L 10 5 L 0 8 z" fill="#2ea043"/>
     </marker>
   </defs>
   <text x="300" y="35" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">The Human Role in Machine Learning</text>
   
   <rect x="175" y="60" width="250" height="40" class="box" stroke="#2ea043"/>
   <text x="300" y="80" class="text" fill="#2ea043">Human Engineer / Scientist</text>
   
   <path d="M 300 100 L 300 130" class="arrow"/>
   
   <rect x="120" y="130" width="360" height="150" class="box"/>
   <text x="300" y="155" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Steers &amp; Configures:</text>
   <text x="150" y="185" fill="#c9d1d9" font-family="sans-serif" font-size="13">• Chooses &amp; cleans data</text>
   <text x="150" y="210" fill="#c9d1d9" font-family="sans-serif" font-size="13">• Defines the task objectives</text>
   <text x="150" y="235" fill="#c9d1d9" font-family="sans-serif" font-size="13">• Selects learning model / algorithm</text>
   <text x="150" y="260" fill="#c9d1d9" font-family="sans-serif" font-size="13">• Evaluates &amp; validates results</text>
   
   <path d="M 300 280 L 300 310" class="arrow"/>
   
   <rect x="175" y="310" width="250" height="45" class="box" fill="#238636"/>
   <text x="300" y="332.5" class="text" fill="#ffffff">Robust Learning System</text>
</svg>