<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
   <rect width="100%" height="100%" fill="#0d1117"/>
   <style>
     .bg-card { fill: #161b22; stroke: #30363d; stroke-width: 3px; rx: 12px; }
     .title { fill: #ffffff; font-family: sans-serif; font-size: 42px; font-weight: bold; text-anchor: middle; }
     .subtitle { fill: #8b949e; font-family: sans-serif; font-size: 24px; text-anchor: middle; }
     .box-title { font-family: sans-serif; font-size: 28px; font-weight: bold; text-anchor: middle; }
     .desc { fill: #8b949e; font-family: sans-serif; font-size: 20px; text-anchor: middle; }
   </style>
   
   <!-- Header -->
   <text x="640" y="80" class="title">WHAT IS MACHINE LEARNING?</text>
   <text x="640" y="125" class="subtitle">Concept 1: Traditional Rules vs. Learned Parameters</text>
   
   <!-- Left Card: Traditional Rules -->
   <rect x="120" y="180" width="460" height="420" class="bg-card" stroke="#58a6ff"/>
   <text x="350" y="240" class="box-title" fill="#58a6ff">TRADITIONAL CODE</text>
   <rect x="170" y="280" width="360" height="70" fill="#21262d" stroke="#30363d" rx="8"/>
   <text x="350" y="322" fill="#58a6ff" font-family="monospace" font-size="20" text-anchor="middle">Input + Manual Rules</text>
   <text x="350" y="420" class="desc">Human writes explicit logic</text>
   <text x="350" y="460" class="desc">for every single scenario.</text>
   
   <!-- VS Divider -->
   <text x="640" y="405" fill="#f85149" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="middle">VS</text>
   
   <!-- Right Card: Learned Parameters -->
   <rect x="700" y="180" width="460" height="420" class="bg-card" stroke="#2ea043"/>
   <text x="930" y="240" class="box-title" fill="#2ea043">MACHINE LEARNING</text>
   <rect x="750" y="280" width="360" height="70" fill="#21262d" stroke="#30363d" rx="8"/>
   <text x="930" y="322" fill="#2ea043" font-family="monospace" font-size="20" text-anchor="middle">Data + Labels = Model</text>
   <text x="930" y="420" class="desc">System discovers patterns</text>
   <text x="930" y="460" class="desc">automatically from examples.</text>
   
   <!-- Footer Badge -->
   <rect x="440" y="635" width="400" height="45" fill="#1f6feb" rx="8"/>
   <text x="640" y="663" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">From First Principles</text>
</svg>