<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
   <rect width="100%" height="100%" fill="#0d1117"/>
   <style>
     .box { fill: #161b22; stroke: #30363d; stroke-width: 2px; rx: 6px; }
     .text { fill: #c9d1d9; font-family: sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
     .arrow { stroke: #2ea043; stroke-width: 2.5px; fill: none; marker-end: url(#arrow); }
   </style>
   <defs>
     <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
       <path d="M 0 2 L 10 5 L 0 8 z" fill="#2ea043"/>
     </marker>
   </defs>
   <text x="300" y="35" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Generalization Concept</text>
   
   <rect x="175" y="65" width="250" height="45" class="box" stroke="#58a6ff"/>
   <text x="300" y="87" class="text" fill="#58a6ff">Training Examples</text>
   <path d="M 300 110 L 300 145" class="arrow"/>
   
   <rect x="175" y="145" width="250" height="45" class="box"/>
   <text x="300" y="167" class="text">Trained Model</text>
   <path d="M 300 190 L 300 225" class="arrow"/>
   
   <rect x="175" y="225" width="250" height="45" class="box" stroke="#58a6ff"/>
   <text x="300" y="247" class="text" fill="#58a6ff">New / Unseen Data</text>
   <path d="M 300 270 L 300 305" class="arrow"/>
   
   <rect x="175" y="305" width="250" height="45" class="box" fill="#1f6feb"/>
   <text x="300" y="327" class="text" fill="#ffffff">Successful Generalization</text>
</svg>